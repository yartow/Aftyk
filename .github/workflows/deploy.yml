name: Deploy

# Bouwt de app en zet dist/ via FTPS op de cPanel-hosting bij elke merge naar main.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: rsj34.rhostjh.com
          port: 21
          protocol: ftps
          username: claude@andrewensandra.com
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          # Een cPanel-FTP-account start in zijn eigen hoofdmap; pas aan als de app in een submap moet.
          server-dir: ./
